name: CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev

jobs:
    test-lint-build-e2e:
        name: Test, Lint, Build & E2E
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run unit & smoke tests
              run: npm test

            - name: Build project
              run: npm run build

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run E2E tests
              run: npm run test:e2e
